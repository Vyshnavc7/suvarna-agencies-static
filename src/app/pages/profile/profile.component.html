<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card profile-card" *ngIf="currentUser$ | async as user">
                <div class="card-body text-center">
                    <div class="profile-header mb-4">
                        <div class="profile-pic-lg mx-auto">
                            <img [src]="'https://ui-avatars.com/api/?name=' + user.name + '&background=random&size=128'"
                                alt="Profile">
                        </div>
                        <h3 class="mt-3 font-weight-bold">{{ user.name }}</h3>
                        <p class="text-muted">{{ user.email }}</p>
                        <span class="badge badge-primary px-3 py-2">{{ user.userType || 'Customer' }}</span>
                    </div>

                    <div class="row mt-4 text-left justify-content-center">
                        <div class="col-md-8">
                            <div class="list-group list-group-flush">
                                <div class="list-group-item d-flex justify-content-between align-items-center">
                                    <span><i class="fas fa-envelope mr-3 text-primary"></i> Email</span>
                                    <span class="font-weight-bold">{{ user.email }}</span>
                                </div>
                                <div class="list-group-item d-flex justify-content-between align-items-center">
                                    <span><i class="fas fa-user-tag mr-3 text-primary"></i> Account Type</span>
                                    <span class="font-weight-bold text-capitalize">{{ user.userType || 'Standard'
                                        }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5" *ngIf="!(currentUser$ | async)">
                <p>Please log in to view your profile.</p>
            </div>
        </div>
    </div>
</div>
