<!-- banner -->
<div class="banner_inner">
    <div class="services-breadcrumb">
        <div class="inner_breadcrumb">
            <ul class="short">
                <li>
                    <a routerLink="/">Home</a>
                    <i>|</i>
                </li>
                <li>Contact Us</li>
            </ul>
        </div>
    </div>
</div>
<!--//banner -->

<section class="contact-container py-5">
    <div class="container">

        <div class="contact-header">
            <h3>Get In Touch</h3>
            <p>We'd love to hear from you. Here is how you can reach us</p>
        </div>

        <!-- Info Cards -->
        <div class="row mb-5">
            <div class="col-lg-4 mb-4 mb-lg-0">
                <div class="contact-info-card">
                    <div class="icon-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h5>Address</h5>
                    <p>Suvarna Agencies, <br> Kannur, Kerala, India</p>
                </div>
            </div>

            <div class="col-lg-4 mb-4 mb-lg-0">
                <div class="contact-info-card">
                    <div class="icon-wrapper">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <h5>Email</h5>
                    <p>
                        <a href="mailto:sunilkumar1705&#64;gmail.com">agenciessuvarna&#64;gmail.com</a>
                    </p>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="contact-info-card">
                    <div class="icon-wrapper">
                        <i class="fas fa-phone-alt"></i>
                    </div>
                    <h5>Phone</h5>
                    <p>
                        <a href="tel:9847921072">+91 98479 21072</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="contact-form-section">
                    <h4>Send us a Message</h4>

                    <div *ngIf="successMessage" class="alert alert-success">
                        {{ successMessage }}
                    </div>
                    <div *ngIf="errorMessage" class="alert alert-danger">
                        {{ errorMessage }}
                    </div>

                    <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-group">
                                    <label>Your Name</label>
                                    <input class="form-control" type="text" name="Name" placeholder="Sunil kumar"
                                        required [(ngModel)]="formData.Name">
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-group">
                                    <label>Email Address</label>
                                    <input class="form-control" type="email" name="Email"
                                        placeholder="agenciessuvarna@gmail.com" required [(ngModel)]="formData.Email">
                                </div>
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label>Message</label>
                            <textarea class="form-control" name="Message" placeholder="How can we help you?" required
                                [(ngModel)]="formData.Message"></textarea>
                        </div>

                        <div class="text-center text-lg-left">
                            <button type="submit" class="btn btn-submit"
                                [disabled]="!contactForm.form.valid || isLoading">
                                <span *ngIf="isLoading" class="spinner-border spinner-border-sm mr-2"></span>
                                <span *ngIf="!isLoading">Send Message <i class="fas fa-paper-plane ml-2"></i></span>
                                <span *ngIf="isLoading">Sending...</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="map-container">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3904.379694991759!2d75.37456601403315!3d11.878627441131142!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba43d0d1b9c450d%3A0x42fee5871c4bc8eb!2sSuvarna%20agencies!5e0!3m2!1sen!2sin!4v1630740587179!5m2!1sen!2sin"
                allowfullscreen="" loading="lazy"></iframe>
        </div>

    </div>
</section>
