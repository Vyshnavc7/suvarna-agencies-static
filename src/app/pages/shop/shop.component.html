<!-- banner -->
<div class="banner_inner">
    <div class="services-breadcrumb">
        <div class="inner_breadcrumb">
            <ul class="short">
                <li>
                    <a routerLink="/">Home</a>
                    <i>|</i>
                </li>
                <li>Shop</li>
            </ul>
        </div>
    </div>
</div>
<!--//banner -->

<!--/shop-->
<section class="shop-container py-5">
    <div class="container-fluid">
        <div class="inner-sec-shop px-lg-4 px-3">
            <h3 class="tittle-w3layouts my-4 text-center">Our Products</h3>
            <div class="row">
                <!-- Data Filtering Sidebar -->
                <div class="col-lg-3 side-bar">
                    <div class="search-hotel mb-4">
                        <h3 class="agileits-sear-head">Search</h3>
                        <form action="#" method="post" class="d-flex">
                            <input class="form-control mr-2" type="search" name="search" placeholder="Search..."
                                required="">
                            <button class="btn btn-dark"
                                style="border-radius: 50%; width: 40px; height: 40px; padding: 0;">
                                <i class="fas fa-search"></i>
                            </button>
                        </form>
                    </div>

                    <!-- Filters (Mock) -->
                    <div class="left-side mb-4">
                        <h3 class="agileits-sear-head">Categories</h3>
                        <ul class="list-unstyled">
                            <li>
                                <input type="checkbox" class="checked"> <span class="span">Power Tools</span>
                            </li>
                            <li>
                                <input type="checkbox" class="checked"> <span class="span">Accessories</span>
                            </li>
                            <li>
                                <input type="checkbox" class="checked"> <span class="span">Safety Gear</span>
                            </li>
                        </ul>
                    </div>

                    <div class="deal-leftmk left-side">
                        <h3 class="agileits-sear-head">Special Deals</h3>
                        <div class="special-sec1 d-flex align-items-center mb-3">
                            <div class="img-deals mr-3" style="width: 60px;">
                                <img src="assets/images/s1.jpg" class="img-fluid rounded" alt="">
                            </div>
                            <div class="img-deal1">
                                <h6 class="mb-1">Makitha Drill</h6>
                                <a routerLink="/product/1" class="text-secondary small">575.00</a>
                            </div>
                        </div>
                        <div class="special-sec1 d-flex align-items-center mb-3">
                            <div class="img-deals mr-3" style="width: 60px;">
                                <img src="assets/images/s2.jpg" class="img-fluid rounded" alt="">
                            </div>
                            <div class="img-deal1">
                                <h6 class="mb-1">Endico Router</h6>
                                <a routerLink="/product/2" class="text-secondary small">325.00</a>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- //Sidebar -->

                <!-- Product Grid -->
                <div class="col-lg-9">
                    <div class="row">
                        <!-- Dynamic Product List -->
                        <div class="col-xl-3 col-lg-4 col-md-4 col-sm-6 mb-4" *ngFor="let product of products">
                            <div class="product-grid-card">
                                <span class="new-badge" *ngIf="isNew(product.createdAt)">New</span>

                                <div class="image-wrapper">
                                    <ng-container *ngIf="product.image; else noImage">
                                        <img [src]="product.image" alt="{{product.productName}}">
                                    </ng-container>
                                    <ng-template #noImage>
                                        <i class="fas fa-tools fa-3x text-secondary"></i>
                                    </ng-template>
                                </div>

                                <div class="card-body">
                                    <a [routerLink]="['/product', product.id]"
                                        class="product-title">{{product.productName}}</a>

                                    <div class="product-price">
                                        <i class="fas fa-rupee-sign"></i> {{product.price | number:'1.2-2'}}
                                    </div>

                                    <div class="action-row">
                                        <a [routerLink]="['/product', product.id]" class="btn-quick-view">
                                            Quick View
                                        </a>
                                        <button class="btn-add-cart-mini" (click)="addToCart(product)"
                                            title="Add to Cart">
                                            <i class="fas fa-cart-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Empty State -->
                        <div *ngIf="products.length === 0" class="col-12 text-center py-5">
                            <div class="alert alert-light">
                                <i class="fas fa-search fa-2x text-muted mb-3"></i>
                                <p class="mb-0">No products found. Please check back later.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
