<div class="shop-container">
  <!-- Page Title Area -->
  <div class="page-title-area">
    <h1 class="main-title">
      Powering Your Vision <span class="separator">|</span> <span class="sub-title">Explore Our Machinery</span>
    </h1>
  </div>

  <!-- Skeleton Grid -->
  <div class="product-grid" *ngIf="isLoading">
    <div class="product-card" *ngFor="let s of skeletonArray">
      <div class="skeleton-img skeleton-box"></div>
      <div class="card-info mt-3">
        <div class="skeleton-text skeleton-box"></div>
        <div class="skeleton-text short skeleton-box"></div>
        <div class="skeleton-text skeleton-box mt-4" style="height: 24px; width: 40%;"></div>
        <div class="skeleton-box mt-auto" style="height: 40px; border-radius: 8px;"></div>
      </div>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="product-grid" *ngIf="!isLoading">
    <div class="product-card" *ngFor="let product of products">
      <!-- Image Box -->
      <div class="card-image-box">
        <ng-container *ngIf="product.image; else noImage">
          <a [routerLink]="['/product', product.id]" style="display: block; width: 100%; height: 100%; text-align: center; cursor: pointer;">
            <img [src]="product.image" alt="{{product.productName}}">
          </a>
        </ng-container>
        <ng-template #noImage>
          <div class="no-image-placeholder">
            <i class="fas fa-tools"></i>
          </div>
        </ng-template>
        <div class="card-overlay">
          <span class="badge-new" *ngIf="isNew(product.createdAt)">NEW</span>
          <button class="btn-wishlist" [class.active]="isWishlisted(product)" (click)="toggleWishlist(product, $event)" title="Toggle Wishlist">
            <i [class]="isWishlisted(product) ? 'fas fa-heart text-danger' : 'far fa-heart'"></i>
          </button>
        </div>
      </div>
      
      <!-- Card Info -->
      <div class="card-info">
        <h3 class="product-title"><a [routerLink]="['/product', product.id]">{{product.productName}}</a></h3>
        
        <div class="product-rating">
          <i class="fas fa-star text-warning"></i>
          <span class="rating-val">4.9</span>
          <span class="review-count">(215 reviews)</span>
        </div>
        
        <div class="product-price">
          ₹{{product.price | number:'1.0-0'}}
        </div>
        
        <button class="btn-add-cart" (click)="addToCart(product)">
          ADD TO CART
        </button>
      </div>
    </div>
    
    <!-- Empty State -->
    <div *ngIf="products.length === 0" class="empty-state">
      <i class="fas fa-search"></i>
      <p>No products found.</p>
    </div>
  </div>
</div>
