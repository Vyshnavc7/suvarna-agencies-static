<div class="navbar-container">
  <div class="unified-navbar">

    <!-- Left: Logo -->
    <a class="brand-logo" routerLink="/">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
          <defs>
            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f1d072" />
              <stop offset="50%" stop-color="#d0a23d" />
              <stop offset="100%" stop-color="#a07521" />
            </linearGradient>
          </defs>
          <path d="M 75 22.5 L 50 10 L 20 25 L 20 35 L 80 65 L 80 75 L 50 90 L 25 77.5" fill="none"
            stroke="url(#gold-grad)" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter"
            stroke-miterlimit="4" />
        </svg>
      </div>
      <div class="logo-text">
        <span class="brand-name">Suvarna</span>
        <span class="brand-sub">Agencies</span>
      </div>
    </a>

    <!-- Middle: Nav Links -->
    <nav class="nav-links">
      <a routerLink="/shop" routerLinkActive="active" class="nav-item">Products</a>
      <a routerLink="/services" routerLinkActive="active" class="nav-item">Services</a>
      <a routerLink="/about" routerLinkActive="active" class="nav-item">About</a>
    </nav>

    <!-- Right: Actions -->
    <div class="right-actions">

      <!-- Search Bar -->
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search tools...">
      </div>

      <!-- User Profile -->
      <div class="profile-dropdown-wrapper" #profileDropdownContainer
        *ngIf="authService.currentUser | async as user; else loginBtn">
        <button class="profile-trigger" (click)="toggleProfileDropdown()">
          <img [src]="'https://ui-avatars.com/api/?name=' + user.name + '&background=333&color=fff'" alt="Profile">
          <span class="user-name">{{ user.name }}</span>
        </button>

        <!-- Profile Menu -->
        <div class="profile-menu" [class.show]="isProfileDropdownOpen">
          <div class="user-info">
            <h6>{{ user.name }}</h6>
            <small>{{ user.email }}</small>
          </div>
          <a class="dropdown-item" routerLink="/profile"><i class="far fa-user"></i> My Account</a>
          <a class="dropdown-item" routerLink="/orders"><i class="fas fa-box"></i> My Orders</a>
          <!-- <a class="dropdown-item" routerLink="/wishlist"><i class="far fa-heart"></i> My Wishlist</a> -->
          <a class="dropdown-item" routerLink="/settings"><i class="fas fa-cog"></i> Settings</a>
          <a class="dropdown-item text-danger" href="javascript:void(0)" (click)="logout()"><i
              class="fas fa-sign-out-alt"></i> Sign Out</a>
        </div>
      </div>

      <ng-template #loginBtn>
        <a routerLink="/login" class="login-link">Sign In</a>
      </ng-template>

      <!-- Notification Bell -->
      <div class="icon-action bell" title="Notifications">
        <i class="far fa-bell"></i>
        <span class="dot"></span>
      </div>

      <!-- Wishlist -->
      <a routerLink="/wishlist" class="icon-action wishlist" title="My Wishlist">
        <i class="far fa-heart"></i>
      </a>

      <!-- Cart -->
      <a routerLink="/cart" class="icon-action cart" title="My Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="badge" *ngIf="(cartItemCount$ | async) as count">{{ count }}</span>
        <span class="badge" *ngIf="!(cartItemCount$ | async)">0</span>
      </a>

    </div>
  </div>
</div>
