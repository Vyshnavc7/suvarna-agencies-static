<div class="login-page">

  <!-- Left decorative panel -->
  <div class="login-panel">
    <!-- Decorative background shapes -->
    <div class="deco deco-ring deco-ring-1"></div>
    <div class="deco deco-ring deco-ring-2"></div>
    <div class="deco deco-ring deco-ring-3"></div>
    <div class="deco deco-dot deco-dot-1"></div>
    <div class="deco deco-dot deco-dot-2"></div>
    <div class="deco deco-dot deco-dot-3"></div>
    <div class="deco deco-line deco-line-1"></div>
    <div class="deco deco-line deco-line-2"></div>

    <div class="panel-content">
      <!-- Brand -->
      <div class="brand-logo">
        <div class="brand-emblem">✦</div>
        <span class="brand-name">Suvarna Agencies</span>
      </div>

      <!-- Central badge -->
      <div class="panel-badge">
        <div class="badge-circle">
          <div class="badge-inner">
            <span class="badge-icon">🛍️</span>
            <span class="badge-label">Premium Store</span>
          </div>
        </div>
      </div>

      <h2 class="panel-headline">Your trusted<br>shopping partner</h2>
      <p class="panel-sub">Quality products · Secure payments · Fast delivery</p>

      <div class="panel-pills">
        <span class="pill">✓ 500+ Products</span>
        <span class="pill">✓ Secure Checkout</span>
        <span class="pill">✓ Easy Returns</span>
      </div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="login-form-side">
    <div class="form-card">

      <div class="form-header">
        <h1 class="form-title">Sign in</h1>
        <p class="form-subtitle">Enter your credentials to continue</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

        <div class="field-group">
          <label class="field-label" for="login-email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input
              id="login-email"
              type="email"
              class="auth-input"
              formControlName="email"
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="login-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input
              id="login-password"
              type="password"
              class="auth-input"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
        </div>

        <button
          id="login-submit"
          type="submit"
          class="btn-signin"
          [disabled]="loginForm.invalid"
        >
          <span>Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

      </form>

      <p class="signup-hint">
        Don't have an account?
        <a routerLink="/signup" class="signup-link">Create one</a>
      </p>

    </div>
  </div>

</div>
