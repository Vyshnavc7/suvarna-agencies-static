<div class="banner_inner">
    <div class="services-breadcrumb">
        <div class="inner_breadcrumb">
            <ul class="short">
                <li>
                    <a routerLink="/">Home</a>
                    <i>|</i>
                </li>
                <li>Sign Up</li>
            </ul>
        </div>
    </div>
</div>

<section class="banner-bottom-wthreelayouts py-lg-5 py-3">
    <div class="container">
        <h3 class="tittle-w3layouts text-center my-lg-4 my-4">Register</h3>
        <div class="inner_sec">
            <div class="login p-5 bg-light mx-auto mw-100" style="max-width: 500px !important;">
                <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
                    <div *ngIf="errorMessage" class="alert alert-danger">
                        {{ errorMessage }}
                    </div>
                    <div class="form-group">
                        <label class="mb-2 ">Full Name</label>
                        <input type="text" class="form-control" formControlName="name" placeholder="" required="">
                    </div>
                    <div class="form-group">
                        <label class="mb-2  d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" formControlName="gender" id="genderMale" value="male">
                            <label class="form-check-label " for="genderMale">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" formControlName="gender" id="genderFemale" value="female">
                            <label class="form-check-label " for="genderFemale">Female</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="mb-2 ">Email address</label>
                        <input type="email" class="form-control" formControlName="email" placeholder="" required="">
                    </div>
                    <div class="form-group">
                        <label class="mb-2 ">Password</label>
                        <input type="password" class="form-control" formControlName="password" placeholder=""
                            required="">
                    </div>
                    <div class="form-group">
                        <label class="mb-2 ">Confirm Password</label>
                        <input type="password" class="form-control" formControlName="confirmPassword" placeholder=""
                            required="">
                        <div *ngIf="signupForm.errors?.['mismatch'] && (signupForm.touched || signupForm.dirty)"
                            class="text-danger small">
                            Passwords do not match
                        </div>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary submit mb-4" [disabled]="signupForm.invalid">Sign
                            Up</button>
                    </div>
                    <p class="text-center ">Already have an account? <a routerLink="/login"
                            class="text-info">Login</a></p>
                </form>
            </div>
        </div>
    </div>
</section>
