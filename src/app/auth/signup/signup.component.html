<div class="signup-page">

  <!-- Left decorative panel -->
  <div class="signup-panel">
    <!-- Decorative background shapes -->
    <div class="deco deco-ring deco-ring-1"></div>
    <div class="deco deco-ring deco-ring-2"></div>
    <div class="deco deco-ring deco-ring-3"></div>
    <div class="deco deco-dot deco-dot-1"></div>
    <div class="deco deco-dot deco-dot-2"></div>
    <div class="deco deco-dot deco-dot-3"></div>
    <div class="deco deco-line deco-line-1"></div>
    <div class="deco deco-line deco-line-2"></div>

    <div class="panel-content">
      <!-- Brand -->
      <div class="brand-logo">
        <div class="brand-emblem">✦</div>
        <span class="brand-name">Suvarna Agencies</span>
      </div>

      <!-- Central badge -->
      <div class="panel-badge">
        <div class="badge-circle">
          <div class="badge-inner">
            <span class="badge-icon">✨</span>
            <span class="badge-label">Join Us</span>
          </div>
        </div>
      </div>

      <h2 class="panel-headline">Start your<br>premium journey</h2>
      <p class="panel-sub">Create an account for exclusive deals,<br>faster checkout & order tracking.</p>

      <div class="panel-pills">
        <span class="pill">✓ 500+ Products</span>
        <span class="pill">✓ Secure Checkout</span>
        <span class="pill">✓ Priority Support</span>
      </div>
    </div>
  </div>

  <!-- Right form panel -->
  <div class="signup-form-side">
    <div class="form-card">

      <div class="form-header">
        <h1 class="form-title">Create Account</h1>
        <p class="form-subtitle">Fill in your details to join</p>
      </div>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="auth-form">
        
        <!-- Full Name -->
        <div class="field-group full-width">
          <label class="field-label" for="signup-name">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input id="signup-name" type="text" class="auth-input" formControlName="name" placeholder="John Doe">
          </div>
        </div>

        <!-- Gender -->
        <div class="field-group full-width">
          <label class="field-label">Gender</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" formControlName="gender" value="male">
              <span class="radio-custom"></span> Male
            </label>
            <label class="radio-label">
              <input type="radio" formControlName="gender" value="female">
              <span class="radio-custom"></span> Female
            </label>
          </div>
        </div>

        <!-- Email -->
        <div class="field-group full-width">
          <label class="field-label" for="signup-email">Email address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="signup-email" type="email" class="auth-input" formControlName="email" placeholder="you@example.com">
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="signup-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="signup-password" type="password" class="auth-input" formControlName="password" placeholder="••••••••">
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="field-group">
          <label class="field-label" for="signup-confirm">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <input id="signup-confirm" type="password" class="auth-input" formControlName="confirmPassword" placeholder="••••••••">
          </div>
          <div *ngIf="signupForm.errors?.['mismatch'] && (signupForm.touched || signupForm.dirty)" class="error-text">
            Passwords do not match
          </div>
        </div>

        <button id="signup-submit" type="submit" class="btn-primary-auth" [disabled]="signupForm.invalid">
          <span>Create Account</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>

      </form>

      <p class="auth-hint">
        Already have an account?
        <a routerLink="/login" class="auth-link">Sign In</a>
      </p>

    </div>
  </div>

</div>
